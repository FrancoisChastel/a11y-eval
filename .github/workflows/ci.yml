name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Integration — accessible control page must pass
        run: node src/cli.ts --url test-fixtures/accessible-form.html --out /tmp/r-accessible

      - name: Integration — flawed page must fail with exit 1
        run: |
          if node src/cli.ts --url test-fixtures/flawed-form.html --out /tmp/r-flawed; then
            echo "Expected exit code 1 for the flawed fixture" && exit 1
          fi

      - name: Integration — crawl discovers all 3 site pages
        run: |
          node src/cli.ts --url test-fixtures/site/index.html --crawl --out /tmp/r-crawl || true
          node -e "
            const r = require('/tmp/r-crawl/report.json');
            if (r.pages.length !== 3) { console.error('expected 3 pages, got', r.pages.length); process.exit(1); }
            if (r.verdict !== 'fail') { console.error('expected fail verdict, got', r.verdict); process.exit(1); }
          "

      - name: Integration — repo mode bundled static scan finds the planted violations
        run: |
          node src/cli.ts --repo test-fixtures/mini-app --no-crawl --url test-fixtures/site/page2.html --out /tmp/r-static
          node -e "
            const r = require('/tmp/r-static/report.json');
            const n = r.findings.filter(f => f.engine === 'static').length;
            if (n !== 5) { console.error('expected 5 static findings, got', n); process.exit(1); }
          "

      - name: Dogfood — the review UI must pass its own evaluator with zero suspects
        run: |
          node src/cli.ts --url /tmp/r-crawl/review.html --out /tmp/r-dogfood
          node -e "
            const r = require('/tmp/r-dogfood/report.json');
            if (r.verdict !== 'pass') { console.error('review.html failed its own evaluation:', JSON.stringify(r.totals)); process.exit(1); }
            const suspects = r.findings.filter(f => f.confidence === 'suspect');
            if (suspects.length > 0) { console.error('review.html raised suspects:', suspects.map(s => s.ruleId)); process.exit(1); }
          "

      - name: Wave-1 engines + interact probes detect the planted wave1 violations
        run: |
          node src/cli.ts --url test-fixtures/wave1.html --interact --out /tmp/r-wave1 || true
          node -e "
            const r = require('/tmp/r-wave1/report.json');
            const rules = new Set(r.findings.map(f => f.ruleId));
            const expected = ['on-focus-context-change','slider-keyboard-inoperable','hover-content-not-dismissible','focus-order-suspect','sensory-instruction-suspect','lang-of-parts-suspect','no-caption-track','target-size-suspect'];
            for (const rule of expected) if (!rules.has(rule)) { console.error('missing rule:', rule); process.exit(1); }
            if (!r.evidence || r.evidence.length === 0) { console.error('expected evidence packets'); process.exit(1); }
            if (r.verdict !== 'fail') { console.error('expected fail verdict'); process.exit(1); }
          "

      - name: Suspects gate only under --strict
        run: |
          node src/cli.ts --url test-fixtures/wave1.html --strict --out /tmp/r-strict || true
          node -e "
            const lax = require('/tmp/r-wave1/report.json');
            const strict = require('/tmp/r-strict/report.json');
            if (!(strict.score < lax.score)) { console.error('strict score must be lower:', strict.score, 'vs', lax.score); process.exit(1); }
            if (strict.totals.moderate <= lax.totals.moderate) { console.error('strict must count suspect findings'); process.exit(1); }
          "

      - name: Integration — merge elevates a manual fail to overall fail (exit 1)
        run: |
          echo '{"items":[{"sc":"2.4.3","status":"fail","evidence":"ci probe"}]}' > /tmp/manual.json
          if node src/cli.ts merge --report /tmp/r-crawl --manual /tmp/manual.json; then
            echo "Expected exit 1 from merge with a manual fail" && exit 1
          fi
          node -e "
            const r = require('/tmp/r-crawl/final-report.json');
            if (r.overall !== 'fail') { console.error('expected overall fail, got', r.overall); process.exit(1); }
            if (!r.findings.some(f => f.engine === 'human')) { console.error('missing human finding'); process.exit(1); }
          "

      - name: Integration — mitigations.md is an executable work order (both modes)
        run: |
          node -e "
            const fs = require('fs');
            const md = fs.readFileSync('/tmp/r-crawl/mitigations.md', 'utf8');
            for (const needle of ['Rules of engagement', 'image-alt', 'Do NOT', 'Instances to fix', '--baseline']) {
              if (!md.includes(needle)) { console.error('mitigations.md missing:', needle); process.exit(1); }
            }
          "
          node src/cli.ts mitigate --report /tmp/r-crawl
          node -e "
            const md = require('fs').readFileSync('/tmp/r-crawl/mitigations.md', 'utf8');
            if (!md.includes('Manual review failures')) { console.error('mitigate did not include merged manual failures'); process.exit(1); }
          "

      - name: Optimizer — metric dry run (identity low, hand-fixed 1.0, deletion guarded)
        run: python3 optimizer/optimize.py --dry-run

      - name: Optimizer — adjudicator gold-label metric dry run
        run: python3 optimizer/optimize.py --target adjudicator --dry-run

      - name: Integration — baseline diff classifies fixed findings
        run: |
          node src/cli.ts --url test-fixtures/site/page2.html --baseline /tmp/r-crawl/report.json --out /tmp/r-baseline || true
          node -e "
            const d = require('/tmp/r-baseline/report.json').baselineDiff;
            if (!d || d.fixedCount < 1) { console.error('expected fixed findings in baseline diff', JSON.stringify(d)); process.exit(1); }
          "
